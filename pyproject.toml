[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mona-llms-txt"
version = "0.1.0"
description = "Generate llms.txt and llms-full.txt from a website sitemap"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "MONA Software"}]

[project.scripts]
mona-llms-txt = "mona_llms_txt.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

